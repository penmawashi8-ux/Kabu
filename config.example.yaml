# ------------------------------------------------------------------------------
# kabu 設定ファイル
#   cp config.example.yaml config.yaml して、config.yaml を編集してください。
#   config.yaml は .gitignore 済みです。パスワードは絶対にここに書かないこと。
# ------------------------------------------------------------------------------

# paper = 発注をシミュレーションするだけ / live = 実際に楽天証券へ発注する
mode: paper

# 株価を見に行く間隔（秒）。1 秒未満は指定できません。
poll_interval_sec: 3

state_file: state.json
journal_file: journal.csv
log_file: logs/kabu.log

excel:
  # マーケットスピードII RSS の関数を置くワークブック（絶対パス推奨）
  workbook: C:/kabu/quotes.xlsx
  quote_sheet: QUOTES     # kabu が自動で組み立てます
  order_sheet: ORDERS     # 注文一覧を出すシート（人が 1 度だけ関数を貼る）
  visible: true           # Excel を画面に出す。目視できたほうが安全

rss:
  # 株価取得。RSS のバージョンで関数名・項目名が違う場合はここを実際の名前に直す。
  quote_function: RssMarket
  price_field: 現在値
  time_field: 現在値時刻

  # 注文一覧シートの見出し文字列 → kabu 内部の項目名の対応。
  # 実際のシートの見出しに合わせて書き換えてください。
  order_columns:
    order_id: 注文番号
    symbol: 銘柄コード
    side: 売買区分
    quantity: 注文数量
    filled_quantity: 約定数量
    avg_price: 約定単価
    status: 状態

  order:
    # 現物注文の関数。楽天証券のオンラインヘルプで確認した書式:
    #   RssStockOrder(発注ID, 発注トリガー, 銘柄コード, 売買区分, 注文区分, SOR区分,
    #                 注文数量, 価格区分, 注文価格, 執行条件, 注文期限, 口座区分,
    #                 逆指値条件価格, 逆指値条件区分, 逆指値価格区分, 逆指値価格,
    #                 セット注文区分, セット注文価格, セット注文執行条件, セット注文期限)
    #   例: =RssStockOrder(1,1,4755,3,0,0,100,0,,1,,0)  → 楽天株 100 株を成行で買い
    #
    # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    # 未解決: RssStockOrder は「セルに書き込む関数」であって、VBA マクロとして
    # 呼ぶものではない可能性が高いです。本ツールの発注処理は Application.Run で
    # マクロとして呼ぶ実装になっているため、そのままでは動かないおそれがあります。
    # 実弾（mode: live）に進む前に、必ず公式の関数一覧 PDF で確認してください:
    #   https://marketspeed.jp/guide/manual/ms2rss_function.pdf
    # 株価取得（kabu play --source rss）だけならこの項目は一切使いません。
    # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    function: RssStockOrder
    cancel_function: RssCancelOrder
    arg_order:
      - order_id           # 発注ID
      - order_trigger      # 発注トリガー
      - symbol             # 銘柄コード
      - side               # 売買区分
      - order_kind         # 注文区分
      - sor                # SOR区分
      - quantity           # 注文数量
      - price_kind         # 価格区分
      - price              # 注文価格
      - condition          # 執行条件
      - expiry             # 注文期限
      - account_type       # 口座区分
    # arg_order のうち、売買ごとに変わらない固定値はここに書く。
    # symbol / side / quantity / price / price_kind は kabu が埋めます。
    defaults:
      order_id: 1
      order_trigger: 1
      order_kind: 0
      sor: 0
      condition: 1
      expiry: ""
      # このファイルは「往復売買」用（サテライト）なので特定口座を既定にしています。
      # NISA 枠で往復させるのは勧めません（README「NISA 口座について」参照）:
      #   * 売買を繰り返すと年間の投資枠をすぐ使い切る（売っても年内は枠が戻らない）
      #   * 損益通算・繰越控除ができないので、損切りしても税金面の救済がない
      #
      # 買って持ち続けるだけの枠（コア）は逆に NISA が向いています。
      # そちらは config.core.yaml を使ってください。
      #
      # 警告は「NISA 口座か」ではなく「NISA で往復売買しようとしているか」で出ます。
      # 有効なルールに max_cycles: 2 以上か stop_loss があるときだけです。
      account_type: 0

  # 取引パスワードは環境変数から読みます（設定ファイルには書かない）。
  #   PowerShell:  $env:KABU_TRADE_PASSWORD = "..."
  password_env: KABU_TRADE_PASSWORD

risk:
  max_orders_per_day: 20          # 1 日の発注件数上限
  max_notional_per_order: 300000  # 1 回の約定代金上限（円）
  max_notional_per_day: 1000000   # 1 日の買付総額上限（円）
  min_seconds_between_orders: 10  # 連射防止
  max_price_deviation_pct: 10     # 前回値からこれ以上飛んだ値段は誤配信とみなし無視
  quote_max_age_sec: 60           # これより古い株価では発注しない
  pending_timeout_sec: 600        # 注文がこの秒数約定しなければ停止して人間を待つ
  kill_switch_file: STOP          # このファイルを作るとループが安全に停止する

market:
  timezone: Asia/Tokyo
  sessions:                       # 東証（2024/11 以降の後場は 15:30 まで）
    - ["09:00", "11:30"]
    - ["12:30", "15:30"]
  trade_cutoff: "15:20"           # これ以降は新規の買いを出さない
  # close_positions_at: "15:25"   # 有効にすると保有分を成行で手仕舞いする
  holidays:                       # 祝日・年末年始は YYYY-MM-DD で列挙
    - "2026-01-01"
    - "2026-01-02"
    - "2026-01-03"

rules:
  - id: toyota
    symbol: "7203.T"    # 銘柄コード.市場
    quantity: 100       # 単元株数の倍数で
    buy_at: 2800        # 現在値がこの値以下になったら買う
    sell_at: 3000       # 現在値がこの値以上になったら売る
    stop_loss: 2700     # 任意。この値以下になったら成行で損切り
    order_type: limit   # limit（指値）または market（成行）
    max_cycles: 3       # 何往復まで繰り返すか
    enabled: true

  - id: sony
    symbol: "6758.T"
    quantity: 100
    buy_at: 3200
    sell_at: 3500
    order_type: limit
    max_cycles: 1
    enabled: false
